name: CI

on:
  push:
    branches: [main] # on push to main branch

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend 
    steps:
      - uses: actions/checkout@v5 # checkout code on linux machine 
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked # install deps from uv.lock, fail if it doesnt match pyproject.toml
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6 # also validates the Gradle wrapper
        with:
          cache-provider: basic # actions/cache, not the default proprietary cache with its own terms of use
      # The on-device keyboard patcher (phase 3) embeds the Morphe patcher and the gboard-patches
      # bundle. Morphe publishes only to GitHub Packages (needs a token), so the patcher and its
      # settings plugin are built from their public source into the local Maven repository instead.
      # An ephemeral GPG key, thrown away with the runner, signs those publications.
      - name: Bootstrap Morphe toolchain
        working-directory: ${{ github.workspace }}
        run: |
          gpg --batch --passphrase '' --quick-gen-key "pesto-ci <ci@pesto.local>" default default never
          gboard-patches/tools/bootstrap-morphe.sh -Psigning.gnupg.keyName=ci@pesto.local
      # UI validation: level 1 is lintDebug (Android Lint with compose-lints); levels 2 and 3 are in the
      # Robolectric tests of every screen (layout on the semantics tree, accessibility checks).
      # assembleDebug also builds the gboard-patches bundle (:patches:buildAndroid) as an app asset.
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug --console=plain
