name: CI

on:
  push:
    branches: [main] # on push to main branch

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend 
    steps:
      - uses: actions/checkout@v5 # checkout code on linux machine 
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked # install deps from uv.lock, fail if it doesnt match pyproject.toml
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6 # also validates the Gradle wrapper
        with:
          cache-provider: basic # actions/cache, not the default proprietary cache with its own terms of use
      - run: ./gradlew assembleDebug testDebugUnitTest --console=plain
