org.gradle.parallel = true
org.gradle.caching = true
kotlin.code.style = official
version = 0.1.0

# The settings plugin declares a GitHub Packages repository whose credentials provider is read
# eagerly at configuration time. The patcher is served from mavenLocal, so this repository is never
# actually queried; these dummy values only keep the provider from throwing. A real token is not
# needed to build these patches.
gpr.user = unused
gpr.key = unused
