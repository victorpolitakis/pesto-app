[project]
name = "pesto-server"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Victor Politakis", email = "103646488+victorpolitakis@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.2",
]

[project.scripts]
pesto-server = "pesto_server:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
tools = [
    "sounddevice>=0.5.6",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["tools"]
markers = ["live: needs the real Soniox or claude (not run in CI)"]
addopts = "-m 'not live'"
