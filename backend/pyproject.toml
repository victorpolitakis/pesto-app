[project]
name = "pesto-server"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Victor Politakis", email = "103646488+victorpolitakis@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
pesto-server = "pesto_server:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
